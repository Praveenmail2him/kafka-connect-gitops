# Subset of the upstream Strimzi Connect JMX exporter rules:
# https://github.com/strimzi/strimzi-kafka-operator/blob/1.3.1/examples/metrics/kafka-connect-metrics.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-metrics
  namespace: kafka-connect-gitops
  labels:
    app: strimzi
data:
  metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: kafka.consumer<type=consumer-fetch-manager-metrics, client-id=(.+), topic=(.+), partition=(.+)><>(records-lag|records-lag-max|records-lead)
        name: kafka_consumer_fetch_manager_$4
        labels:
          clientId: "$1"
          topic: "$2"
          partition: "$3"
        help: "Kafka consumer lag"
        type: GAUGE
      - pattern: 'kafka.connect<type=connector-task-metrics, connector=(.+), task=(.+)><>status: ([a-z-]+)'
        name: kafka_connect_connector_task_status
        value: 1
        labels:
          connector: "$1"
          task: "$2"
          status: "$3"
        help: "Kafka Connect task status"
        type: GAUGE
      - pattern: kafka.connect<type=task-error-metrics, connector=(.+), task=(.+)><>(deadletterqueue-produce-requests|deadletterqueue-produce-failures|total-record-errors|total-record-failures)
        name: kafka_connect_task_error_$3
        labels:
          connector: "$1"
          task: "$2"
        help: "Kafka Connect task error and dead-letter metrics"
        type: GAUGE
      - pattern: kafka.connect<type=connect-worker-rebalance-metrics><>(rebalance-avg-time-ms|rebalancing|completed-rebalances-total|rebalance-max-time-ms)
        name: kafka_connect_worker_rebalance_$1
        help: "Kafka Connect rebalance metrics"
        type: GAUGE
