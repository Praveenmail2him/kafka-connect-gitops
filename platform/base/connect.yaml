# ImageStream must exist before the KafkaConnect build starts.
# Strimzi builds the Connect image with OpenShift Builds and pushes it here.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: connect-tier1-cdc
  namespace: kafka-connect-gitops
  labels:
    app.kubernetes.io/name: connect-tier1-cdc
spec:
  lookupPolicy:
    local: false
---
# Upstream KafkaConnect build example, using an OpenShift ImageStream instead of ttl.sh.
# https://github.com/strimzi/strimzi-kafka-operator/blob/1.3.1/examples/connect/kafka-connect-build.yaml
# The Apache Kafka connect-file plugin is the open-source stand-in for the
# Debezium and sink plugins in the architecture proposal. Those plugins need
# external databases and object storage that this cluster does not have.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: connect-tier1-cdc
  namespace: kafka-connect-gitops
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.3.2
  replicas: 1
  bootstrapServers: demo-kafka-kafka-bootstrap:9093
  groupId: connect-tier1-cdc-group
  configStorageTopic: connect-tier1-cdc-configs
  offsetStorageTopic: connect-tier1-cdc-offsets
  statusStorageTopic: connect-tier1-cdc-status
  tls:
    trustedCertificates:
      - secretName: demo-kafka-cluster-ca-cert
        pattern: "*.crt"
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    connect.protocol: compatible
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter.schemas.enable: "false"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: connect-metrics
        key: metrics-config.yml
  build:
    output:
      type: imagestream
      image: connect-tier1-cdc:latest
    plugins:
      - name: kafka-connect-file
        artifacts:
          - type: maven
            group: org.apache.kafka
            artifact: connect-file
            version: 4.3.2
