apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: kafka-connect-gitops
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: kafka-connect-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
        app.kubernetes.io/part-of: kafka-connect-gitops
    spec:
      containers:
        - name: orders-service
          image: image-registry.openshift-image-registry.svc:5000/kafka-connect-gitops/orders-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: demo-kafka-kafka-bootstrap:9092
            - name: APP_KAFKA_ORDERS_TOPIC
              value: orders
            - name: CONNECT_URL
              value: http://connect-tier1-cdc-connect-api:8083
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1280Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: kafka-connect-gitops
  labels:
    app.kubernetes.io/name: orders-service
spec:
  selector:
    app.kubernetes.io/name: orders-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orders-service
  namespace: kafka-connect-gitops
  labels:
    app.kubernetes.io/name: orders-service
spec:
  to:
    kind: Service
    name: orders-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
