# Community OperatorHub install of the upstream Strimzi operator.
# CRDs (kafka.strimzi.io/v1) are installed by this subscription.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: kafka-connect-gitops
  namespace: kafka-connect-gitops
spec:
  targetNamespaces:
    - kafka-connect-gitops
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: strimzi-kafka-operator
  namespace: kafka-connect-gitops
spec:
  channel: strimzi-1.x
  installPlanApproval: Automatic
  name: strimzi-kafka-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  startingCSV: strimzi-cluster-operator.v1.3.1
