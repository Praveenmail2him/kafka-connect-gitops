# Upstream Strimzi FileStream source example.
# https://github.com/strimzi/strimzi-kafka-operator/blob/1.3.1/examples/connect/source-connector.yaml
# Reads the Apache Kafka LICENSE shipped in the worker image. This stands in for
# a database CDC source, which needs an external database.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: license-file-source
  namespace: kafka-connect-gitops
  labels:
    strimzi.io/cluster: connect-tier1-cdc
spec:
  class: org.apache.kafka.connect.file.FileStreamSourceConnector
  tasksMax: 1
  autoRestart:
    enabled: true
    maxRestarts: 5
  config:
    file: /opt/kafka/LICENSE
    topic: license-lines
