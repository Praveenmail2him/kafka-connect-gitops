server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: orders-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:demo-kafka-kafka-bootstrap:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: orders-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.orders
        spring.json.use.type.headers: true
    admin:
      fail-fast: false

app:
  kafka:
    orders-topic: orders
  connect:
    url: ${CONNECT_URL:http://connect-tier1-cdc-connect-api:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: orders-service
    description: Order API for the open-source Kafka Connect GitOps example
